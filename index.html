<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sets">
<meta name="theme-color" content="#0b0b0f">
<title>Sets</title>
<style>
:root{--bg:#0b0b0f;--card:#16161d;--line:#26262f;--tx:#f4f4f6;--mu:#8b8b98;--ac:#c6ff3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px);max-width:560px;margin:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{background:var(--card);border:1px solid var(--line);color:var(--tx);width:44px;height:44px;border-radius:14px;font-size:20px}
.mid{text-align:center;flex:1}
.mid input{background:none;border:0;color:var(--mu);font-size:14px;text-align:center;width:100%}
h1{margin:0;font-size:24px;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.ch{display:flex;justify-content:space-between;align-items:center}
.ch b{font-size:18px;letter-spacing:-.3px}
.hint{color:var(--mu);font-size:13px;margin-top:4px}
.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.set span:first-child{color:var(--mu);width:44px;font-size:14px}
.set .v{flex:1;font-weight:600;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--mu);font-size:18px;padding:6px 10px}
.add{display:flex;gap:8px;margin-top:10px}
input.n{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font-size:16px}
.btn{background:var(--ac);color:#000;border:0;border-radius:12px;font-weight:700;padding:12px 16px;font-size:16px}
.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.new{display:flex;gap:8px;margin-top:18px}
.foot{display:flex;gap:8px;margin-top:26px}.foot .btn{flex:1;font-size:14px}
.empty{color:var(--mu);text-align:center;margin-top:30px}
</style></head><body>
<div class="top"><button class="nav" data-a="prev">‹</button>
<div class="mid"><h1 id="t"></h1><input type="date" id="d"></div>
<button class="nav" data-a="next">›</button></div>
<div id="list"></div>
<div class="new"><input class="n" id="en" list="names" placeholder="Nouvel exercice…" autocomplete="off"><datalist id="names"></datalist><button class="btn" data-a="addEx">+</button></div>
<div class="foot"><button class="btn ghost" data-a="exp">Backup</button><button class="btn ghost" data-a="imp">Restaurer</button></div>
<script>
const DAYS=["Dimanche · Repos complet","Lundi · Upper Chest + Shoulders + Triceps","Mardi · Back + Biceps","Mercredi · Legs + Abs","Jeudi · Repos (marche 20–30 min)","Vendredi · Chest + Back","Samedi · Shoulders + Arms + Abs"];
const TPL={
1:[["Incline Chest Press Machine","3 × 8–12"],["Incline Dumbbell Press","2 × 8–12"],["Low-to-High Cable Fly","2 × 12–15"],["Machine Lateral Raises","3 × 12–20"],["Single-Arm Cable Lateral Raises","2 × 12–15"],["Rope Triceps Pushdown","2 × 10–15"],["Overhead Cable Triceps Extension","2 × 10–15"]],
2:[["Neutral-Grip Lat Pulldown","3 × 8–12"],["Chest-Supported Row","3 × 8–12"],["Single-Arm Cable Lat Pulldown","2 × 10–15"],["Straight-Arm Cable Pulldown","2 × 12–15"],["Reverse Pec Deck","2 × 12–20"],["Preacher Curl Machine","2 × 10–12"],["Incline Dumbbell Curl","2 × 10–15"]],
3:[["Leg Press","3 × 8–12"],["Seated Leg Curl","3 × 10–15"],["Leg Extension","2 × 10–15"],["Dumbbell Romanian Deadlift","2 × 8–12"],["Standing Calf Raises","3 × 12–15"],["Cable Crunch","3 × 12–15"],["Dead Bug","2 × 10 / côté"]],
5:[["Incline Chest Press Machine","2 × 8–12"],["Seated Chest Press Machine","2 × 8–12"],["Pec Deck","2 × 12–15"],["Seated Cable Row","3 × 8–12"],["Wide-Grip Lat Pulldown","2 × 10–12"],["Chest-Supported Row","2 × 10–12"],["Reverse Pec Deck","2 × 15–20"]],
6:[["Shoulder Press Machine","2 × 8–12"],["Machine Lateral Raises","3 × 12–20"],["Cable Lateral Raises","2 × 12–15"],["Cable Rear Delt Fly","2 × 12–20"],["Cable Biceps Curl","3 × 10–12"],["Hammer Curl","2 × 10–15"],["Rope Triceps Pushdown","2 × 10–15"],["Overhead Triceps Extension","2 × 10–15"],["Plank","3 × 30–45 sec"]]
};
let S={logs:{}};
try{S=JSON.parse(localStorage.getItem("sets")||'{"logs":{}}')}catch(e){}
const save=()=>{try{localStorage.setItem("sets",JSON.stringify(S))}catch(e){}};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
let cur=iso(new Date());
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=()=>{if(!S.logs[cur]){const w=new Date(cur+"T12:00:00").getDay();S.logs[cur]=(TPL[w]||[]).map(x=>({n:x[0],t:x[1],s:[]}))}return S.logs[cur]};
function last(name){
  const k=Object.keys(S.logs).filter(d=>d<cur).sort().reverse();
  for(const d of k){const e=S.logs[d].find(x=>x.n.toLowerCase()===name.toLowerCase());
    if(e&&e.s.length)return e.s.map(s=>s.w+"×"+s.r).join(" · ")}
  return "";
}
function render(){
  const dt=new Date(cur+"T12:00:00");
  t.textContent=DAYS[dt.getDay()];d.value=cur;
  const L=day();
  list.innerHTML=L.length?L.map((e,i)=>{const l=last(e.n);return `<div class="card"><div class="ch"><b>${esc(e.n)}</b><button class="x" data-a="delEx" data-i="${i}">🗑</button></div>
  ${(e.t||l)?`<div class="hint">${e.t?"Objectif "+esc(e.t):""}${e.t&&l?" · ":""}${l?"Dernière fois "+esc(l):""}</div>`:""}
  ${e.s.map((s,j)=>`<div class="set"><span>Set ${j+1}</span><span class="v">${s.w} kg × ${s.r}</span><button class="x" data-a="delSet" data-i="${i}" data-j="${j}">✕</button></div>`).join("")}
  <div class="add"><input class="n" type="number" inputmode="decimal" placeholder="kg" id="w${i}"><input class="n" type="number" inputmode="numeric" placeholder="reps" id="r${i}"><button class="btn" data-a="addSet" data-i="${i}">+ Set</button></div></div>`}).join(""):'<div class="empty">Repos 😴 Récupération et bonne nutrition.<br>Ajoute un exercice si tu veux 👇</div>';
  const all=new Set();Object.values(S.logs).forEach(a=>a.forEach(e=>all.add(e.n)));
  names.innerHTML=[...all].map(n=>`<option value="${esc(n)}">`).join("");
}
const shift=n=>{const x=new Date(cur+"T12:00:00");x.setDate(x.getDate()+n);cur=iso(x);render()};
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,j=+b.dataset.j;
  if(a==="prev")shift(-1);
  else if(a==="next")shift(1);
  else if(a==="addEx"){const n=en.value.trim();if(!n)return;day().push({n,s:[]});en.value="";save();render()}
  else if(a==="addSet"){const w=parseFloat(document.getElementById("w"+i).value),r=parseInt(document.getElementById("r"+i).value);
    if(isNaN(w)||isNaN(r))return;day()[i].s.push({w,r});save();render();
    const nw=document.getElementById("w"+i);if(nw){nw.value=w;document.getElementById("r"+i).focus()}}
  else if(a==="delSet"){day()[i].s.splice(j,1);save();render()}
  else if(a==="delEx"){if(confirm("Supprimer cet exercice ?")){day().splice(i,1);save();render()}}
  else if(a==="exp"){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert("Backup copié. Colle-le dans Notes.")).catch(()=>prompt("Copie ce backup :",j))}
  else if(a==="imp"){const j=prompt("Colle ton backup :");if(!j)return;try{const o=JSON.parse(j);if(o.logs){S=o;save();render()}}catch(e){alert("Backup invalide")}}
});
d.addEventListener("change",()=>{if(d.value){cur=d.value;render()}});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
